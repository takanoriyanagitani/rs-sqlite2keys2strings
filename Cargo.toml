[package]
name = "rs-sqlite2keys2strings"
version = "0.1.0"
edition = "2024"

description = "Lookup keys in SQLite and output JSON"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-sqlite2keys2strings"
homepage = "https://github.com/takanoriyanagitani/rs-sqlite2keys2strings"
documentation = "https://docs.rs/rs-sqlite2keys2strings/latest"
keywords = ["sqlite", "json", "wasi", "kvstore"]

exclude = [
  "sqlite2keys2strings.wasm",
  "example.sqlite.db3",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "sqlite2keys2strings"

[dependencies.rusqlite]
version = "0.40.2"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]

[dependencies.serde_json]
version = "1.0.154"
default-features = false
features = [
    "std",
]
